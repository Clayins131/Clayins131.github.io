name: Refresh official macro data

on:
  workflow_dispatch:
  schedule:
    - cron: '45 6 * * 1-5'
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-macro-data.yml'
      - 'assets/macro-*.js'
      - 'scripts/refresh-market-data.mjs'
      - 'tests/macro-data.test.cjs'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh official feeds with dated fallback
        run: node scripts/refresh-market-data.mjs
      - name: Verify data adapters and pricing
        run: node --test tests/*.test.cjs
      - name: Save verified snapshot
        run: |
          if ! git diff --quiet -- data/macro-snapshot.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/macro-snapshot.json
            git commit -m "Refresh official macro and zero-curve observations"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy refreshed site
        id: deployment
        uses: actions/deploy-pages@v4
